{% extends "base.html" %}

{% block title %}Upload Paper - Admin - PrediQ{% endblock %}

{% block content %}
<div class="container my-5">
    <h2 class="text-primary-custom mb-4">
        <i class="fas fa-upload"></i> Upload Question Paper
    </h2>

    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card">
                <div class="card-body p-4">
                    <form method="POST" enctype="multipart/form-data">
                        <!-- File Upload -->
                        <div class="mb-4">
                            <label for="file" class="form-label">Select PDF File *</label>
                            <input type="file" class="form-control" id="file" name="file" accept=".pdf" required>
                            <small class="text-muted">Maximum file size: 10MB</small>
                        </div>

                        <div class="row">
                            <!-- Paper Title -->
                            <div class="col-md-6 mb-3">
                                <label for="title" class="form-label">Paper Title *</label>
                                <input type="text" class="form-control" id="title" name="title" required>
                            </div>

                            <!-- Year -->
                            <div class="col-md-6 mb-3">
                                <label for="year" class="form-label">Year *</label>
                                <input type="number" class="form-control" id="year" name="year" min="2000" max="2030" required>
                            </div>

                            <!-- Class Level -->
                            <div class="col-md-6 mb-3">
                                <label for="class_level" class="form-label">Class Level *</label>
                                <select class="form-select" id="class_level" name="class_level" required>
                                    <option value="">Select Class</option>
                                    <option value="10th">10th</option>
                                    <option value="2nd_PU">2nd PU</option>
                                </select>
                            </div>

                            <!-- Board -->
                            <div class="col-md-6 mb-3">
                                <label for="board" class="form-label">Board *</label>
                                <select class="form-select" id="board" name="board" required>
                                    <option value="">Select Board</option>
                                    <option value="CBSE">CBSE</option>
                                    <option value="STATE">State Board</option>
                                </select>
                            </div>

                            <!-- Course -->
                            <div class="col-md-6 mb-3" id="courseDiv" style="display: none;">
                                <label for="course" class="form-label">Course (for 2nd PU)</label>
                                <select class="form-select" id="course" name="course">
                                    <option value="">Select Course</option>
                                    <option value="PCMB">PCMB</option>
                                    <option value="PCMC">PCMC</option>
                                </select>
                            </div>

                            <!-- Subject -->
                            <div class="col-md-6 mb-3">
                                <label for="subject" class="form-label">Subject *</label>
                                <select class="form-select" id="subject" name="subject" required>
                                    <option value="">Select Subject</option>
                                    <option value="Mathematics">Mathematics</option>
                                    <option value="Science">Science</option>
                                    <option value="Social Science">Social Science</option>
                                    <option value="English">English</option>
                                    <option value="Physics">Physics</option>
                                    <option value="Chemistry">Chemistry</option>
                                    <option value="Biology">Biology</option>
                                    <option value="Computer Science">Computer Science</option>
                                </select>
                            </div>
                        </div>

                        <!-- Submit Button -->
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary btn-lg">
                                <i class="fas fa-upload"></i> Upload Question Paper
                            </button>
                            <a href="{{ url_for('admin_dashboard') }}" class="btn btn-outline-secondary">
                                <i class="fas fa-arrow-left"></i> Back to Dashboard
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
document.getElementById('class_level').addEventListener('change', function() {
    const courseDiv = document.getElementById('courseDiv');
    if (this.value === '2nd_PU') {
        courseDiv.style.display = 'block';
        document.getElementById('course').required = true;
    } else {
        courseDiv.style.display = 'none';
        document.getElementById('course').required = false;
        document.getElementById('course').value = '';
    }
});
</script>
{% endblock %}
